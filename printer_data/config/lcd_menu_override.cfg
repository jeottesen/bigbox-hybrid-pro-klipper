# =============================================================================
# LCD menu overrides
#
# Overrides Klipper's built-in default LCD menu:
# https://github.com/Klipper3d/klipper/blob/master/klippy/extras/display/menu.cfg
# =============================================================================

[menu __main __octoprint]
name: Octoprint
type: list
enable: False
 
[menu __main __estop]
type: command
index: 0
name: EMERGENCY STOP
gcode: M112

[menu __main __control __dock]
type: command
enable: {printer.print_stats.state != "printing"}
name: Dock Toolhead
gcode: DOCK_POSITION

[menu __main __sdcard]
type: list
name: Print
 
[menu __main __sdcard __files]
type: vsdlist
enable: {('virtual_sdcard' in printer)}
name: Files

[menu __main __sdcard __pause_at_layer]
# Dial in a layer number and click to arm SET_PAUSE_AT_LAYER
# pauses once that layer is reached. Dialing back to 0 disables it.
type: input
name: Pause@Layer: {'OFF' if menu.input|int == 0 else '%3d' % (menu.input|int)}
input: {printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer.layer if printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer.enable else 0}
input_min: 0
input_max: {printer.print_stats.info.total_layer|default(999)}
input_step: 1
gcode:
    {% if menu.input|int == 0 %}
        SET_PAUSE_AT_LAYER ENABLE=0
    {% else %}
        SET_PAUSE_AT_LAYER LAYER={menu.input|int}
    {% endif %}

[menu __main __sdcard __start]
type: command
enable: {('virtual_sdcard' in printer) and printer.virtual_sdcard.file_path and not printer.virtual_sdcard.is_active}
name:
    {% if printer.virtual_sdcard.file_path %}
        Start: { printer.virtual_sdcard.file_path.split('/')[-1] }
    {% else %}
        Start printing
    {% endif %}
gcode: M24
 
[menu __main __sdcard __start]
name:
    {% if printer.virtual_sdcard.file_path %}
        Start: { printer.virtual_sdcard.file_path.split('/')[-1] }
    {% else %}
        Start printing
    {% endif %}

# Scrolling M117/SET_DISPLAY_TEXT messages. Stock just truncates at 16 chars;
# this scrolls through long messages over time instead. It's same trick the stock
# templates use for blinking icons, just applied to horizontal position.
[display_template _print_status]
text:
  {% if printer.display_status.message %}
      {% set msg = printer.display_status.message %}
      {% set width = 16 %}                                                  ; matches this display's fixed 16-column grid
      {% set speed = 3 %}                                                   ; scroll speed, in characters/second
      {% if msg|length <= width %}
          { msg }
      {% else %}
          {% set gap = "   " %}                                            ; blank gap shown once the message wraps back to its start
          {% set loop_str = msg ~ gap %}
          {% set period = loop_str|length %}
          {% set offset = (printer.toolhead.estimated_print_time * speed)|int % period %}
          {% set doubled = loop_str ~ loop_str %}                          ; doubled so a single slice can never run past the end of the string
          { doubled[offset:offset + width] }
      {% endif %}
  {% elif printer.idle_timeout.printing_time %}
      {% set pos = printer.toolhead.position %}
      { "X%-4.0fY%-4.0fZ%-5.2f" % (pos.x, pos.y, pos.z) }
  {% else %}
      Ready
  {% endif %}