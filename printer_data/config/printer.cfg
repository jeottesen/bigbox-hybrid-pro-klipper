[include fluidd.cfg]

# Had to update pyserial for the default 250000 baud rate to work
# `~/klippy-env/bin/pip install -U pyserial`
[mcu]
serial: /dev/serial/by-id/usb-RRD__www.ru_RUMBA_-_ATmega_2560_co_9533335313735141A251-if00


[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 8

# Note: The direction pin was flipped for the original drivers.
# BTT TMC2209 v1.3 upgrade UART pins
# Axis	TMC2209 	UART pin	EXP3 pin 
# X		PDN_UART	14			PC6
# Y		PDN_UART	13			PC7
# Z		PDN_UART	12			PJ0
# Z1	PDN_UART	11			PJ1
# E0	PDN_UART	10			SDA (PD1)
# Be sure to disable all jumpers before enabling uart. 
# All might not be necessary but it's the easiest.

[stepper_x]
step_pin: PH0
dir_pin: PH1
enable_pin: !PL1
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50
second_homing_speed: 10
homing_retract_dist: 5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400

[tmc2209 stepper_x]
uart_pin: PC6
run_current: 1.36
sense_resistor: 0.110

[stepper_y]
step_pin: PF0
dir_pin: !PL2
enable_pin: !PF1
endstop_pin: ^PC2
position_endstop: 0
position_min: 0
position_max: 245
homing_speed: 50
second_homing_speed: 10
homing_retract_dist: 5
rotation_distance: 40
gear_ratio: 36:16
microsteps: 16 ; The original config was at 8. on old drivers all jumpers needed to be on for 16
full_steps_per_rotation: 400

[tmc2209 stepper_y]
uart_pin: PC7
run_current: 1.36
sense_resistor: 0.110

# Z-AXIS (left leadscrew)
[stepper_z]
step_pin: PF3
dir_pin: !PF2
enable_pin: !PK0
endstop_pin: probe:z_virtual_endstop
position_min: -1 ; Tolerance of ir probe.
position_max: 300
homing_speed: 6
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z]
uart_pin: PJ0
run_current: 1.6 ; change to 1.36 once separated
sense_resistor: 0.110

# Stepper buzz before enabling!
# Z1-AXIS (right leadscrew, E1 slot)
# [stepper_z1]
# step_pin: PA4
# dir_pin: !PA3
# enable_pin: !PA5
# rotation_distance: 8
# microsteps: 16
# full_steps_per_rotation: 200

# [tmc2209 stepper_z1]
# uart_pin: PJ1
# run_current: 1.36
# sense_resistor: 0.110

[extruder]
step_pin: PA1
dir_pin: PA0
enable_pin: !PA2
rotation_distance: 22.694 
microsteps: 16
full_steps_per_rotation: 400
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PE4
sensor_type: PT100 INA826
sensor_pin: PK2 
min_temp: 0
max_temp: 300
max_extrude_only_distance: 50.0
pressure_advance: 0.02
#control: pid
#pid_Kp: 46.19
#pid_Ki: 5.28
#pid_Kd: 101.02

[tmc2209 extruder]
uart_pin: PD1
run_current: 1.36
sense_resistor: 0.110

[heater_bed]
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK3
min_temp: 5
max_temp: 150
#control: pid
#pid_Kp: 336
#pid_Ki: 61
#pid_Kd: 462.4

[probe]
pin: PC4 ;  Added a 10k resistor to the connector between 5v and OUT to get it to boot into the correct mode on power on.
speed: 2.0
lift_speed: 10.0
samples: 5
samples_result: median
samples_tolerance: 0.1
samples_tolerance_retries: 5
sample_retract_dist: 2
x_offset: -65.0
y_offset: 0
#z_offset: .38

[fan]
pin: PH4

[heater_fan hotend_fan]
pin: PH5 ; Set at MCU startup in case it loses power while hot
heater: extruder
heater_temp: 40.0

# "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
[display]
lcd_type: st7920
cs_pin: PD2
sclk_pin: PD3
sid_pin: PL7
encoder_pins: ^PB5, ^PB6
click_pin: ^!PL6

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 235, 195
probe_count: 6, 4
algorithm: bicubic
fade_start: 1
fade_end: 10

[verify_heater extruder]
check_gain_time: 60
heating_gain: 20
hysteresis: 20
max_error: 120

[verify_heater heater_bed]
hysteresis: 20
max_error: 120

[exclude_object]

[bed_screws]
screw1: 15, 15
screw1_name: Front Left Screw
screw2: 285, 15
screw2_name: Front Right Screw
screw3: 285, 185
screw3_name: Back Right Screw
screw4: 15, 185
screw4_name: Back Left Screw

[screws_tilt_adjust]
screw1: 80, 15
screw1_name: Front Left Screw (Reference Base)
screw2: 300, 15
screw2_name: Front Right Screw (Sampled at X=235)
screw3: 300, 185
screw3_name: Rear Right Screw (Sampled at X=235)
screw4: 80, 185
screw4_name: Rear Left Screw
horizontal_move_z: 10.0
screw_thread: CW-M3

# enable when stepper_z1 is added
# [z_tilt]
# z_positions:
#   -25, 100                  # Left Z leadscrew physical location
#   325, 100                  # Right Z leadscrew physical location
# points:
#   80, 100                   # Nozzle position for probing left (Probe lands at X=15)
#   300, 100                  # Nozzle position for probing right (Probe lands at X=235)
# retries: 5                   # Maximum retry attempts
# retry_tolerance: 0.02        # Stops adjusting once left/right delta is under 0.02mm

[homing_override]
axes: xyz
gcode:
    # if Z is homed then drop the z axis.
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600         # Drop the bed 10mm safely
        G90
    {% else %}
        # Z is unhomed (like after a fresh power on).
        # We DO NOT move Z to prevent grinding at the bottom frame.
        SET_KINEMATIC_POSITION Z=0
    {% endif %}

    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set xy_homed = 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
    {% set need_xy_for_probe = (home_all or 'Z' in params) and not xy_homed %}

    # ---- HOME Y ----
    {% if home_all or 'Y' in params or need_xy_for_probe %}
        G28 Y
    {% endif %}

    # ---- HOME X ----
    {% if home_all or 'X' in params or need_xy_for_probe %}
        G28 X
    {% endif %}

    # ---- HOME All/Z ----
    {% if home_all or 'Z' in params %}
        G1 X215 Y100 F9000  # Move probe to center - X/Y now guaranteed homed above
        # Set initial z position
        G28 Z
        # Prevent the probe from being in the triggered state
        G91
        G1 Z1 F600
        G90
        # Dial it in by probing multiple times
        PROBE
        # Call seperate macro so that the probe results are set correctly
        _APPLY_CALIBRATED_Z_HOME
    {% endif %}

[gcode_macro _APPLY_CALIBRATED_Z_HOME]
gcode:
    {% set master_offset = printer.configfile.settings.probe.z_offset | float %}
    {% set last_probe_z = printer.probe.last_probe_position.z | float %}
    {% set true_current_z = master_offset - last_probe_z %}
    {action_respond_info("Master Offset: %f | Measured Position: %f | New Z Position: %f" % (master_offset, last_probe_z, true_current_z))}
    SET_KINEMATIC_POSITION Z={true_current_z}

[gcode_macro DOCK_POSITION]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                          ; home if not already homed
    {% endif %}

    SAVE_GCODE_STATE NAME=DOCK_POSITION
    G90                             ; absolute positioning
    G1 X100 Y200 F3000               ; dock position
    G1 X100 Y240 F3000
	RESTORE_GCODE_STATE NAME=DOCK_POSITION
    

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # Start heating bed and set standby hotend temp to prevent oozing/sensor interference
    M140 S{BED_TEMP}
    M109 S175 ; set to 170 for pla and wait.
    
    # Prevent ooze from messing with bed probing.
    G91
    G1 E-3 F1800
    G90

    G28

    # Drop to a cooler standby for the (potentially long) bed heatup + mesh
    M104 S150

    # Wait for bed to reach full target temperature
    M190 S{BED_TEMP}
    
    # Generate a fresh adaptive bed mesh at target temperature
    BED_MESH_CALIBRATE ADAPTIVE=1
    
    # Bring extruder up to printing temperature and wait
    M104 S{EXTRUDER_TEMP}
    DOCK_POSITION
    M109 S{EXTRUDER_TEMP}
    
    # Prime nozzle
    M117 Print Starting
    G92 E0
    G1 E15 F200
    G1 E-1.5 F1800      # retract to relieve pressure before traveling
    G92 E0
    # Safely leave dock
    G1 X100 Y200 F3000 

[gcode_macro END_PRINT]
gcode:
    M117 Print Complete
    
    # Relative positioning to retract ooze and clear nozzle of print
    G91
    G1 E-4 F1800
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 5) %}
        G1 Z5 F3000
    {% endif %}
    G90
    
    # Turn off heaters and fan
    M140 S0
    M106 S0
    M104 S0

    DOCK_POSITION
    
    # Disable steppers
    M84

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Heating for Load...
    M109 S{TEMP}
    M117 Loading Filament...
    G91
    G1 E25 F200
    G1 E25 F200
    G90
    M104 S0
    M117 Load Complete

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Heating for Unload...
    M109 S{TEMP}
    M117 Unloading Filament...
    G91
    G1 E2 F1000
    G4 S2
    G1 E-60 F2500
    G90
    M104 S0
    M117 Filament Unloaded

[gcode_macro M600]
gcode:
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-4 F1800
    G1 Z10 F3000
    G90
    DOCK_POSITION
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off

[include timelapse.cfg]

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% if x_min < 0 %}
            {% set x_min = 0 %}
        {% endif %}
    
        {% set y_min = printer.toolhead.axis_minimum.y %}
        {% if y_min < 0 %}
            {% set y_min = 0 %}
        {% endif %}
    
        {% set x_min = x_min + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = y_min + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

