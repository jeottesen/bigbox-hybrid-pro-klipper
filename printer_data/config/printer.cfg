# System includes
[include fluidd.cfg]
[include timelapse.cfg]

# Custom includes
[include macros/utility.cfg]
[include macros/homing_override.cfg]
[include macros/start_print.cfg]
[include macros/end_print.cfg]
[include macros/beeper.cfg]
#[include macros/test_speed.cfg]

# Had to update pyserial and reflash firmware for the default 250000 baud rate to work
# `~/klippy-env/bin/pip install -U pyserial`
[mcu]
serial: /dev/serial/by-id/usb-RRD__www.ru_RUMBA_-_ATmega_2560_co_9533335313735141A251-if00

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 8

# Note: The direction pin was flipped for the original drivers.
# BTT TMC2209 v1.3 upgrade UART pins
# Axis	TMC2209 	UART pin	EXP3 pin 
# X		PDN_UART	14			PC6
# Y		PDN_UART	13			PC7
# Z		PDN_UART	12			PJ0
# Z1	PDN_UART	11			PJ1
# E0	PDN_UART	10			SDA (PD1)
# Be sure to disable all jumpers before enabling uart. 
# All might not be necessary but it's the easiest.

[stepper_x]
step_pin: PH0
dir_pin: PH1
enable_pin: !PL1
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50
second_homing_speed: 10
homing_retract_dist: 5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400

[tmc2209 stepper_x]
uart_pin: PC6
run_current: 1.36
sense_resistor: 0.110

[stepper_y]
step_pin: PF0
dir_pin: !PL2
enable_pin: !PF1
endstop_pin: ^PC2
position_endstop: 0
position_min: 0
position_max: 245
homing_speed: 50
second_homing_speed: 10
homing_retract_dist: 5
rotation_distance: 40
gear_ratio: 36:16
microsteps: 16 ; The original config was at 8. on old drivers all jumpers needed to be on for 16
full_steps_per_rotation: 400

[tmc2209 stepper_y]
uart_pin: PC7
run_current: 1.36
sense_resistor: 0.110

# Z-AXIS (left leadscrew)
[stepper_z]
step_pin: PF3
dir_pin: !PF2
enable_pin: !PK0
endstop_pin: probe:z_virtual_endstop
position_min: -1 ; Tolerance of ir probe.
position_max: 300
homing_speed: 6
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z]
uart_pin: PJ0
run_current: 1.6 ; change to 1.36 once separated
sense_resistor: 0.110

# Stepper buzz before enabling!
# Z1-AXIS (right leadscrew, E1 slot)
# [stepper_z1]
# step_pin: PA4
# dir_pin: !PA3
# enable_pin: !PA5
# rotation_distance: 8
# microsteps: 16
# full_steps_per_rotation: 200

# [tmc2209 stepper_z1]
# uart_pin: PJ1
# run_current: 1.36
# sense_resistor: 0.110

[extruder]
step_pin: PA1
dir_pin: PA0
enable_pin: !PA2
rotation_distance: 22.694 
microsteps: 16
full_steps_per_rotation: 400
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000
filament_diameter: 1.75
nozzle_diameter: 0.600
heater_pin: PE4
sensor_type: PT100 INA826
sensor_pin: PK2 
min_temp: 0
max_temp: 300
max_extrude_only_distance: 50.0
pressure_advance: 0.02
#control: pid
#pid_Kp: 46.19
#pid_Ki: 5.28
#pid_Kd: 101.02

[tmc2209 extruder]
uart_pin: PD1
run_current: 1.36
sense_resistor: 0.110

[heater_bed]
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK3
min_temp: 5
max_temp: 115
#control: pid
#pid_Kp: 336
#pid_Ki: 61
#pid_Kd: 462.4

[probe]
pin: PC4 ;  Added a 10k resistor to the connector between 5v and OUT to get it to boot into the correct mode.
speed: 2.0
lift_speed: 10.0
samples: 5
samples_result: median
samples_tolerance: 0.1
samples_tolerance_retries: 5
sample_retract_dist: 2
x_offset: -65.0
y_offset: 0
#z_offset: .38

[fan]
pin: PH4

[heater_fan hotend_fan]
pin: PH5 ; Set at MCU startup in case it loses power while hot
heater: extruder
heater_temp: 40.0

# "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
[display]
lcd_type: st7920
cs_pin: PD2
sclk_pin: PD3
sid_pin: PL7
encoder_pins: ^PB5, ^PB6
click_pin: ^!PL6

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 235, 195
probe_count: 6, 4
algorithm: bicubic
fade_start: 1
fade_end: 10

[verify_heater extruder]

[verify_heater heater_bed]
check_gain_time: 90

[exclude_object]

[bed_screws]
screw1: 15, 15
screw1_name: Front Left Screw
screw2: 285, 15
screw2_name: Front Right Screw
screw3: 285, 185
screw3_name: Back Right Screw
screw4: 15, 185
screw4_name: Back Left Screw

[screws_tilt_adjust]
screw1: 80, 15
screw1_name: Front Left Screw (Reference Base)
screw2: 300, 15
screw2_name: Front Right Screw (Sampled at X=235)
screw3: 300, 185
screw3_name: Rear Right Screw (Sampled at X=235)
screw4: 80, 185
screw4_name: Rear Left Screw
horizontal_move_z: 10.0
screw_thread: CW-M3

# enable when stepper_z1 is added
# [z_tilt]
# z_positions:
#   -25, 100                  # Left Z leadscrew physical location
#   325, 100                  # Right Z leadscrew physical location
# points:
#   80, 100                   # Nozzle position for probing left (Probe lands at X=15)
#   300, 100                  # Nozzle position for probing right (Probe lands at X=235)
# retries: 5                   # Maximum retry attempts
# retry_tolerance: 0.02        # Stops adjusting once left/right delta is under 0.02mm

