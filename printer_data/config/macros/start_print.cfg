[gcode_macro _SP_VARS]
variable_purge_amount: 5
variable_purge_speed: 200
variable_wipe_retract: 1.5
variable_wipe_retract_speed: 1800
gcode:
    # Prime/wipe tuning values for START_PRINT only - not called directly.

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    _SP_PREHEAT_BED BED_TEMP={BED_TEMP}
    _SP_PREVENT_OOZE
    _SP_HOME
    _SP_Z_TILT
    _SP_WAIT_BED BED_TEMP={BED_TEMP}
    _SP_MESH
    _SP_HEAT_EXTRUDER EXTRUDER_TEMP={EXTRUDER_TEMP}
    _SP_PRIME
	_SP_CHECK_CANCEL STEP="Printing"
	BEEP I=1

[gcode_macro _SP_CHECK_CANCEL]
gcode:
	{% set step = params.MACRO|default("") %}
    {% set step = params.STEP|default("") %}
    {% if printer.print_stats.state == "cancelled" %}
		BEEP I=4
		M117 Cancelled: {step}
        { action_raise_error("Print cancelled during: %s" % step) }
    {% endif %}
    {% if step %}
        M117 Print: {step}
        {action_respond_info("Print: %s" % step)}
    {% endif %}

[gcode_macro _SP_PREHEAT_BED]
gcode:
    _SP_CHECK_CANCEL STEP="Preheat Bed"
    {% set BED_TEMP = params.BED_TEMP|float %}
    M140 S{BED_TEMP}
    M104 S175 ; standby hotend temp - protects IR probe / prevents oozing

[gcode_macro _SP_PREVENT_OOZE]
gcode:
    _SP_CHECK_CANCEL STEP="Retract Ooze"
    M109 S175
    G91
    G1 E-3 F1800
    G90

[gcode_macro _SP_HOME]
gcode:
    _SP_CHECK_CANCEL STEP="Home"
    M104 S150 ; cooler standby while bed finishes heating + mesh runs
    G28

[gcode_macro _SP_Z_TILT]
gcode:
    _SP_CHECK_CANCEL STEP="Z Tilt"
    Z_TILT_ADJUST

[gcode_macro _SP_WAIT_BED]
gcode:
    _SP_CHECK_CANCEL STEP="Heat Bed"
    {% set BED_TEMP = params.BED_TEMP|float %}
    M190 S{BED_TEMP}

[gcode_macro _SP_MESH]
gcode:
    _SP_CHECK_CANCEL STEP="Bed Mesh"
    BED_MESH_CALIBRATE METHOD=rapid_scan ;ADAPTIVE=1

[gcode_macro _SP_HEAT_EXTRUDER]
gcode:
    _SP_CHECK_CANCEL STEP="Heat Nozzle"
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|float %}
    M104 S{EXTRUDER_TEMP}
    DOCK_POSITION
    M109 S{EXTRUDER_TEMP}

[gcode_macro _SP_PRIME]
gcode:
    _SP_CHECK_CANCEL STEP="Wipe Nozzle"
    {% set sp = printer["gcode_macro _SP_VARS"] %}
    {% set dock = printer["gcode_macro _DOCK_VARS"] %}
    G92 E0
    G1 E{sp.purge_amount} F{sp.purge_speed}
    G1 E-{sp.wipe_retract} F{sp.wipe_retract_speed}
    G92 E0
    G1 X{dock.dock_x} Y{dock.dock_entrance_y} F3000 ; wipe filament off on rubber piece
	G1 X{dock.dock_x} Y{dock.dock_park_y} F3000 ; go back to wipe again
	G1 X{dock.dock_x} Y{dock.dock_entrance_y} F3000 ; final wipe and leave dock safely.
    