# =============================================================================
# Pause / Resume / Cancel macros — hybrid of Ellis' guide and fluidd-config's
# client.cfg, tuned for this printer.
#
# Source (Ellis): https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/pause_resume_filament.html
# Source (fluidd): https://github.com/fluidd-core/fluidd-config/blob/master/client.cfg
#
# OVERRIDES fluidd.cfg (remove `[include fluidd.cfg]` from printer.cfg
#
# =============================================================================

[pause_resume]

[respond]

[display_status]

[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount (mm)
    {% set retract = params.RETRACT|default(2)|float %}                                       ; retract amount before parking (mm)

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                 ; disable filament sensor (uncomment once a filament sensor is configured)
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; Klipper's raw pause command

        {% set can_extrude = printer[printer.toolhead.extruder].can_extrude %}
        {% set do_hop = (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
        {% if not do_hop %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; log it and record 0 so resume doesn't try to drop back down by z
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}

        G91                                                                                  ; relative positioning
        {% if do_hop and can_extrude %}
            G1 Z{z} E-{retract} F900                                                         ; z hop + retract together
        {% elif do_hop %}
            G1 Z{z} F900                                                                      ; z hop only (too cold to retract)
        {% elif can_extrude %}
            G1 E-{retract} F1800                                                              ; retract only (no z hop room)
        {% endif %}

        G90                                                                                  ; absolute positioning
        DOCK_POSITION                                                                        ; park at this printer's existing dock position for filament changes
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked/dock position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                               ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                        ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_runout_sensor: ""                                                            ; set to e.g. "filament_switch_sensor filament_sensor" once that sensor exists, to gate RESUME on filament actually being present
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                           ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        # ---- the only gate: filament must be present, if a runout sensor is configured ----
        # (temperature is handled automatically below, never gated/aborted on)
        {% set runout_ok = true %}
        {% if runout_sensor != "" %}
            {% set runout_ok = printer[runout_sensor].filament_detected %}
        {% endif %}

        {% if not runout_ok %}
            RESPOND TYPE=error MSG={"'Resume aborted: no filament detected by %s. Load filament, then press RESUME again.' % runout_sensor"}
        {% else %}
            #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                     ; re-enable filament sensor (uncomment once a filament sensor is configured)
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value

            {% if etemp > 0 %}
                M109 S{etemp|int}                                                    ; automatically reheat to the temp it was printing at before pause - blocks here until it's back up to temp, however long that takes
            {% endif %}

            RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                 ; go back to parked/dock position in case toolhead was moved during the pause
            G91                                                                      ; relative positioning
            M83                                                                      ; relative extruder positioning
            {% if printer[printer.toolhead.extruder].can_extrude %}
                G1 Z{zhop * -1} E{e} F900                                            ; prime nozzle by E, lower Z back down
            {% else %}
                G1 Z{zhop * -1} F900                                                 ; lower Z back down without priming - no recorded target temp to reheat to (unusual)
            {% endif %}
            RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                      ; restore print position
            BASE_RESUME                                                              ; Klipper's raw resume command
        {% endif %}
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0                                                ; clear any pending pause-at-layer/next-layer so it doesn't carry into the next print
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    END_PRINT                                                                    ; this printer's end-of-print macro (already calls DOCK_POSITION + cooldown)
    BASE_CANCEL_PRINT

# -----------------------------------------------------------------------------
# Pause at a specific layer, or the next layer (standalone re-implementation
# of the same feature from fluidd's client.cfg - useful for slicer setup /
# debugging, e.g. pausing right after the first couple layers to check that
# print-in-place parts haven't fused before committing to the rest of a print).
#
# Requires slicer to actually report layer numbers to Klipper. In slicer's custom 
# G-code sections, add:
#   - "Layer change G-code":  SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num+1}
#   - "Start G-code": SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count}
#   (check your slicer's placeholder docs if these don't resolve for you.)
#
# Usage:
#   SET_PAUSE_AT_LAYER LAYER=3     ; pause once layer 3 is reached
#   SET_PAUSE_AT_LAYER ENABLE=0    ; cancel a pending pause-at-layer
#   SET_PAUSE_NEXT_LAYER           ; pause as soon as the very next layer starts
#   SET_PAUSE_NEXT_LAYER ENABLE=0  ; cancel
# Both default to calling PAUSE, but MACRO=<name> can point at something else
# (e.g. M600) instead.
# -----------------------------------------------------------------------------

# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0 | 1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
    {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
    {% set ENABLE = params.ENABLE | default(1)|int != 0 %}
    {% set MACRO = params.MACRO | default(pause_next_layer.call, True) %}
    SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0 | 1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
    {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
    {% set ENABLE = params.ENABLE | int != 0 if params.ENABLE is defined
                    else params.LAYER is defined %}
    {% set LAYER = params.LAYER | default(pause_at_layer.layer) | int %}
    {% set MACRO = params.MACRO | default(pause_at_layer.call, True) %}
    SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER=<current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: BASE_SET_PRINT_STATS_INFO
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
    {% if pause_next_layer.enable %}
        RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
        {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
        SET_PAUSE_NEXT_LAYER ENABLE=0
    {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER | int == pause_at_layer.layer %}
        RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
        {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
        SET_PAUSE_AT_LAYER ENABLE=0
    {% endif %}
    BASE_SET_PRINT_STATS_INFO {rawparams}

