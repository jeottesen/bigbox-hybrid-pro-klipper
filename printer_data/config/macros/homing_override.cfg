# Needed for SET_KINEMATIC_POSITION
[force_move]
enable_force_move: True

[gcode_macro _HO_STATE]
variable_initial_state: ""
gcode:
    # Snapshot of print_stats.state as of the start of the homing pass - not called directly.

[homing_override]
axes: xyz
gcode:
	SET_GCODE_VARIABLE MACRO=_HO_STATE VARIABLE=initial_state VALUE='"{printer.print_stats.state}"'
    
    _HO_CHECK_CANCEL STEP="Start"
    _HOME_PREP

    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set xy_homed = 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
    {% set need_xy_for_probe = (home_all or 'Z' in params) and not xy_homed %}

    {% if home_all or 'Y' in params or need_xy_for_probe %}
        _HOME_Y
    {% endif %}
    {% if home_all or 'X' in params or need_xy_for_probe %}
        _HOME_X
    {% endif %}
    {% if home_all or 'Z' in params %}
		_CENTER_PROBE
        _HOME_Z
		_PROBE_Z
    {% endif %}

[gcode_macro _HO_CHECK_CANCEL]
gcode:
    {% set step = params.STEP|default("") %}
    {% set initial = printer["gcode_macro _HO_STATE"].initial_state %}
	# Only interupt homing if the print state changed to cancelled.
    {% if printer.print_stats.state == "cancelled" and initial != "cancelled" %}
        BEEP I=4
        M117 Cancelled: {step}
        { action_raise_error("Print cancelled during: %s" % step) }
    {% endif %}
    {% if step %}
        M117 Home: {step}
        {action_respond_info("HOME: %s" % step)}
    {% endif %}

[gcode_macro _HOME_PREP]
gcode:
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F600         ; Drop the bed 10mm safely
        G90
    {% else %}
        ; Z is unhomed (like after a fresh power on).
        ; We do not move Z to prevent grinding at the bottom frame.
        SET_KINEMATIC_POSITION Z=0
    {% endif %}

[gcode_macro _HOME_Y]
gcode:
    _HO_CHECK_CANCEL STEP="Y"
    G28 Y

[gcode_macro _HOME_X]
gcode:
    _HO_CHECK_CANCEL STEP="X"
    G28 X

[gcode_macro _CENTER_PROBE]
gcode:
    _HO_CHECK_CANCEL STEP="Center"
    G1 X215 Y115 F9000  ; Move probe to center - X/Y now guaranteed homed above

[gcode_macro _HOME_Z]
gcode:
    _HO_CHECK_CANCEL STEP="Z"
    G28 Z

[gcode_macro _PROBE_Z]
gcode:
    _HO_CHECK_CANCEL STEP="Probe Z"
    G91
    G1 Z1 F600           ; Prevent the probe from being in the triggered state
    G90
    PROBE
    _APPLY_CALIBRATED_Z_HOME

[gcode_macro _APPLY_CALIBRATED_Z_HOME]
gcode:
    {% set master_offset = printer.configfile.settings.probe.z_offset | float %}
    {% set last_probe_z = printer.probe.last_probe_position.z | float %}
    {% set true_current_z = master_offset - last_probe_z %}
    {action_respond_info("Master Offset: %f | Measured Position: %f | New Z Position: %f" % (master_offset, last_probe_z, true_current_z))}
    SET_KINEMATIC_POSITION Z={true_current_z}