[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}
    {% endif %}


[gcode_macro _DOCK_VARS]
variable_dock_x: 100
variable_dock_entrance_y: 200   # safe staging point - must pass through before entering/exiting the cutout
variable_dock_park_y: 240       # resting spot inside the frame cutout/bucket
gcode:
    # Shared dock coordinates - not called directly.

[gcode_macro DOCK_POSITION]
gcode:
    {% set vars = printer["gcode_macro _DOCK_VARS"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=DOCK_POSITION
    G90
    G1 X{vars.dock_x} Y{vars.dock_entrance_y} F3000
    G1 X{vars.dock_x} Y{vars.dock_park_y} F3000
    RESTORE_GCODE_STATE NAME=DOCK_POSITION

[gcode_macro OFF]
gcode:
    M84
    TURN_OFF_HEATERS
    M107


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Heating for Load...
    M109 S{TEMP}
    M117 Loading Filament...
    G91
    G1 E50 F200
    G90
    M104 S0
    M117 Load Complete

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Heating for Unload...
    M109 S{TEMP}
    M117 Unloading Filament...
    G91
    G1 E2 F1000
    G4 S2
    G1 E-50 F2500
    G90
    M104 S0
    M117 Filament Unloaded

[gcode_macro M600]
gcode:
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
	BEEP I=3
    G91
    G1 E-4 F1800
    G1 Z10 F3000
    G90
    DOCK_POSITION
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state