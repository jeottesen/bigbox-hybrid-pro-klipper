[include fluidd.cfg]
[mcu]
serial: /dev/serial/by-id/usb-RRD__www.ru_RUMBA_-_ATmega_2560_co_9533335313735141A251-if00
baud = 230400

[virtual_sdcard]
path: /home/jotaro/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PH0
dir_pin: !PH1
enable_pin: !PL1
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400

[stepper_y]
step_pin: PF0
dir_pin: PL2
enable_pin: !PF1
endstop_pin: ^PC2
position_endstop: 0
position_min: 0
position_max: 240
homing_speed: 50
rotation_distance: 40
gear_ratio: 36:16
microsteps: 16
full_steps_per_rotation: 400


[probe]
pin: ^PC4
speed: 2.0
sample_retract_dist: 1.5
lift_speed: 10.0
samples: 5
samples_result: median
samples_tolerance: 0.20
samples_tolerance_retries: 5
x_offset: -65.0
y_offset: -4.5
z_offset: 4.0


[stepper_z]
step_pin: PF3
dir_pin: PF2
enable_pin: !PK0
endstop_pin: probe:z_virtual_endstop
position_min: 0
position_max: 300
homing_speed: 6
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200

[extruder]
step_pin: PA1
dir_pin: !PA0
enable_pin: !PA2
rotation_distance: 23.082
microsteps: 16
full_steps_per_rotation: 400
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PE4
sensor_type: PT100 INA826
sensor_pin: PK2 
min_temp: 0
max_temp: 300
#control: pid
#pid_Kp: 46.19
#pid_Ki: 5.28
#pid_Kd: 101.02

[heater_bed]
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK3
min_temp: 5
max_temp: 150
#control: pid
#pid_Kp: 336
#pid_Ki: 61
#pid_Kd: 462.4

[fan]
pin: PH4

[heater_fan hotend_fan]
pin: PH5
heater: extruder
heater_temp: 40.0

# "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
[display]
lcd_type: st7920
cs_pin: PD2
sclk_pin: PD3
sid_pin: PL7
encoder_pins: ^PB5, ^PB6
click_pin: ^!PL6

[homing_override]
axes: xyz
set_position_z: 0
gcode:
  G91                 # Use relative mode
  G1 Z10 F600         # Safe Z-hop (lowers the bed)
  G90                 # Switch back to absolute mode

  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # ---- HOME Y ----
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}

  # ---- HOME X ----
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  # ---- HOME All/Z ----
  {% if home_all or 'Z' in params %}
    G1 X215 Y100 F9000  # Move to safe Z center
    G28 Z
  {% endif %}

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 235, 190
probe_count: 6, 4
algorithm: bicubic
fade_start: 1
fade_end: 10

[verify_heater extruder]
check_gain_time: 60
heating_gain: 20
hysteresis: 20
max_error: 120

[verify_heater heater_bed]
hysteresis: 20
max_error: 120

[exclude_object]

[gcode_macro DOCK_POSITION]
gcode:
  G1 X100 Y200 F3000              ; dock position
  G1 X100 Y240 F3000

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # Start heating bed and set standby hotend temp to prevent oozing/sensor interference
    M140 S{BED_TEMP}
    M104 S150
    
    # Home all axes
    G28
    
    # Wait for bed to reach full target temperature
    M190 S{BED_TEMP}
    
    # Generate a fresh adaptive bed mesh at target temperature
    BED_MESH_CALIBRATE ADAPTIVE=1
    
    # Bring extruder up to printing temperature and wait
    M104 S{EXTRUDER_TEMP}
    DOCK_POSITION
    M109 S{EXTRUDER_TEMP}
    
    # Prime nozzle
    M117 Print Starting
    G92 E0
    G1 E15 F200
    G92 E0

[gcode_macro END_PRINT]
gcode:
    M117 Print Complete
    # Turn off heaters and fan
    M104 S0
    M140 S0
    M106 S0
    
    # Relative positioning to retract and clear print
    G91
    G1 E-1.5 F1000
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 5) %}
        G1 Z5 F3000
    {% endif %}
    G90
    
    DOCK_POSITION
    
    # Disable steppers
    M84

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Heating for Load...
    M109 S{TEMP}
    M117 Loading Filament...
    G91
    G1 E25 F200
    G1 E25 F200
    G90
    M104 S0
    M117 Load Complete

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M117 Heating for Unload...
    M109 S{TEMP}
    M117 Unloading Filament...
    G91
    G1 E2 F1000
    G4 S2
    G1 E-60 F2500
    G90
    M104 S0
    M117 Filament Unloaded

[gcode_macro M600]
gcode:
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-1.5 F1000
    G1 Z10 F3000
    G90
    G1 X100 Y240 F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

