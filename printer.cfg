[include fluidd.cfg]
[mcu]
serial: /dev/serial/by-id/usb-RRD__www.ru_RUMBA_-_ATmega_2560_co_9533335313735141A251-if00
baud = 230400

[virtual_sdcard]
path: /home/jotaro/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 1500
max_z_velocity: 12
max_z_accel: 500
square_corner_velocity: 5.0

[stepper_x]
step_pin: PH0
dir_pin: !PH1
enable_pin: !PL1
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 400

[stepper_y]
step_pin: PF0
dir_pin: PL2
enable_pin: !PF1
endstop_pin: ^PC2
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 50
rotation_distance: 40
gear_ratio: 36:16
microsteps: 8
full_steps_per_rotation: 400


[probe]
pin: ^PC4
speed: 2.0
sample_retract_dist: 1.5
lift_speed: 10.0
samples: 5
samples_result: median
samples_tolerance: 0.20
samples_tolerance_retries: 5
x_offset: -65.0
y_offset: -4.5
#z_offset: 4.0


[stepper_z]
step_pin: PF3
dir_pin: PF2
enable_pin: !PK0
endstop_pin: probe:z_virtual_endstop
position_min: 0
position_max: 300
homing_speed: 6
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200

[extruder]
step_pin: PA1
dir_pin: !PA0
enable_pin: !PA2
rotation_distance: 23.082
microsteps: 16
full_steps_per_rotation: 400
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PE4
sensor_type: PT100 INA826
sensor_pin: PK2 
min_temp: 0
max_temp: 300
#control: pid
#pid_Kp: 46.19
#pid_Ki: 5.28
#pid_Kd: 101.02

[heater_bed]
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK3
min_temp: 5
max_temp: 150
#control: pid
#pid_Kp: 336
#pid_Ki: 61
#pid_Kd: 462.4

[fan]
pin: PH4

[heater_fan hotend_fan]
pin: PH5
heater: extruder
heater_temp: 40.0

# "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
[display]
lcd_type: st7920
cs_pin: PD2
sclk_pin: PD3
sid_pin: PL7
encoder_pins: ^PB5, ^PB6
click_pin: ^!PL6

[homing_override]
axes: xyz
set_position_z: 0
gcode:
  G91                 # Use relative mode
  G1 Z10 F600         # Safe Z-hop (lowers the bed)
  G90                 # Switch back to absolute mode

  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # ---- HOME Y ----
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}

  # ---- HOME X ----
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  # ---- HOME All/Z ----
  {% if home_all or 'Z' in params %}
    G1 X215 Y100 F9000  # Move to safe Z center
    G28 Z
  {% endif %}

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 235, 190
probe_count: 6, 4
algorithm: bicubic
fade_start: 1
fade_end: 10

[verify_heater extruder]
check_gain_time: 60
heating_gain: 20
hysteresis: 20
max_error: 120

[verify_heater heater_bed]
hysteresis: 20
max_error: 120

