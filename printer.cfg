[include fluidd.cfg]
[mcu]
serial: /dev/serial/by-id/usb-RRD__www.ru_RUMBA_-_ATmega_2560_co_9533335313735141A251-if00
baud = 230400
restart_method: rpi_usb

[virtual_sdcard]
path: /home/jotaro/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 1500
max_z_velocity: 12
max_z_accel: 500
square_corner_velocity: 5.0

[stepper_x]
step_pin: PH0
dir_pin: !PH1
enable_pin: !PL1
microsteps: 16
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 300
rotation_distance: 20
homing_speed: 50

[stepper_y]
step_pin: PF0
dir_pin: PL2
enable_pin: !PF1
microsteps: 16
endstop_pin: ^PC2
position_endstop: 0
position_min: 0
position_max: 240
rotation_distance: 17.778
homing_speed: 50

[probe]
pin: ^PC4
x_offset: -65.0
y_offset: 0.0
z_offset: 3.0

[stepper_z]
step_pin: PF3
dir_pin: PF2
enable_pin: !PK0
endstop_pin: probe:z_virtual_endstop
position_min: -2.0
position_max: 300
homing_speed: 6 
microsteps: 16
rotation_distance: 8

[extruder]
step_pin: PA1
dir_pin: !PA0
enable_pin: !PA2
microsteps: 16
rotation_distance: 11.388
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PE4
sensor_type: PT100 INA826
sensor_pin: PK2 
min_temp: 0
max_temp: 300
control: pid
pid_Kp: 46.19
pid_Ki: 5.28
pid_Kd: 101.02

[heater_bed]
heater_pin: PH6
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK3
control: pid
min_temp: 5
max_temp: 150
pid_Kp: 336
pid_Ki: 61
pid_Kd: 462.4

[fan]
pin: PH4
kick_start_time: 0.100
off_below: 0.20
# Default is 0.010. Increase to 0.015 or 0.020 if the fan whines
cycle_time: 0.010

[heater_fan hotend_fan]
pin: PH5
heater: extruder
heater_temp: 40.0

# "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
[display]
lcd_type: st7920
cs_pin: PD2
sclk_pin: PD3
sid_pin: PL7
encoder_pins: ^PB5, ^PB6
click_pin: ^!PL6

[safe_z_home]
home_xy_position: 150, 100

[bed_mesh]
speed: 50 
horizontal_move_z: 5
mesh_min: 10, 15 
mesh_max: 295, 195
probe_count: 4, 4

[verify_heater extruder]
check_gain_time: 60
heating_gain: 20
hysteresis: 20
max_error: 120

[verify_heater heater_bed]
hysteresis: 20
max_error: 120